<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic AI Studio · 制作工作台</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--card:#1a212c;--edge:#303d50;--text:#eaf0f9;--muted:#9dacc1;--gold:#f1c87c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}header{padding:28px 4vw;border-bottom:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0}p{margin:8px 0;color:var(--muted)}small{color:var(--muted)}button,select,input,textarea{font:inherit;background:#111925;color:var(--text);border:1px solid var(--edge);padding:8px 12px;border-radius:7px}button{cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);color:#17202a}main{padding:24px 4vw}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:24px}.card{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:16px}.value{font-size:22px;color:var(--gold)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.tag{display:inline-block;padding:2px 8px;background:#293746;color:#cedcea;border-radius:4px;margin:3px;font-size:12px}.warning{color:#f3c98d}.ok{color:#96d6be}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,monospace;color:#b8c9df}video,img,audio{width:100%;max-height:480px;background:#080b10;border-radius:7px}textarea{display:block;width:100%;min-height:72px;margin:8px 0}input{max-width:100%}.hidden{display:none}details{margin-top:10px}h2{font-size:18px}h3{margin:4px 0 8px}.error{border-color:#d37f7f;color:#ffd3d3}#message{white-space:pre-wrap}footer{padding:24px 4vw;color:var(--muted);font-size:12px}
</style>
<header><div><small>LOCAL PRODUCTION WORKBENCH · v0.5.1</small><h1 id="title">Cinematic AI Studio</h1><p>剧本、角色、镜头、成本与验收，保存在本机项目中。</p></div><button id="refresh">刷新项目</button></header>
<main><div id="message"></div><div class="metrics" id="metrics"></div><nav id="nav"></nav><section id="content"></section></main>
<footer>模型生成须在命令行明确授权预算。技术检查与运动证据不能代替身份、表演、口型和电影质量的人工验收。</footer>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('cinema-session')||'';if(token)sessionStorage.setItem('cinema-session',token);history.replaceState(null,'',location.pathname);let data=null,page='shots';
const $=id=>document.getElementById(id);function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function card(title,text){const c=node('article',undefined,'card');c.append(node('h3',title));if(text)c.append(node('p',text));return c}function detail(c,label,value){const d=node('details');d.append(node('summary',label),node('pre',JSON.stringify(value,null,2)));c.append(d)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}function message(t){$('message').textContent=t}
function preview(c,file){const m=data.media.find(m=>m.file.replaceAll('\\','/')===file.replaceAll('\\','/'));if(!m)return;const n=node(m.type.startsWith('image/')?'img':m.type.startsWith('audio/')?'audio':'video');n.src='/media/'+m.id+'?token='+encodeURIComponent(token);if(n.tagName!=='IMG')n.controls=true;n.preload='metadata';c.append(n)}
function reviewForm(c,target,sha,raw=false){if(!sha)return;const select=node('select');for(const s of ['motion','editorial']){const o=node('option',s==='motion'?'运动复核':'综合视听复核');o.value=s;select.append(o)}if(target==='episode')select.value='editorial';const who=node('input');who.placeholder='复核人';const note=node('textarea');note.placeholder='实际看到的动作、身份、连续性或口型问题 / 通过理由';c.append(select,who,note);for(const decision of ['approve','reject']){const b=node('button',decision==='approve'?'记录通过':'记录驳回');b.onclick=async()=>{try{await api('/api/review',{target,scope:select.value,decision,reviewer:who.value,note:note.value,sha256:sha,raw});message('已保存与素材哈希绑定的复核记录。');await load()}catch(e){message(e.message)}};c.append(b)}}
function render(){if(!data)return;$('title').textContent=data.title;$('metrics').replaceChildren();for(const [label,value]of [['时长',data.plan.target_seconds+' 秒'],['镜头',data.plan.shots.length],['授权预算',data.cost.budget_usd===null?'未授权':'$'+data.cost.budget_usd],['已预留上限','$'+data.cost.reserved_ceiling_usd],['实际账单','未核对'],['人工复核',data.review.status]]){const c=card(label);c.append(node('div',String(value),'value'));$('metrics').append(c)}$('content').replaceChildren();const grid=node('div',undefined,'grid');$('content').append(grid);
if(page==='shots')for(const shot of data.plan.shots){const e=(data.accepted||data.manifest.shots||[]).find(x=>x.shot_id===shot.id);const r=data.review.shots.find(x=>x.id===shot.id);const c=card(shot.id+' · '+shot.duration+'s · '+shot.story_beat,shot.action);c.append(node('p',shot.camera+' · '+shot.expression));if(e){const relative=f=>f.replace(data.project_directory,'').replace(/^[\\/]/,'');preview(c,relative(e.source_file));if(e.generated_file!==e.source_file){const d=node('details');d.append(node('summary','原始生成素材'));preview(d,relative(e.generated_file));c.append(d)}reviewForm(c,shot.id,e.source_sha256)}else c.append(node('p','尚未完成 / 查看任务详情','warning'));detail(c,'镜头调度、连续性与质量', {shot,review:r});const b=node('button','复制单镜头重做命令');b.disabled=!e||data.cost.budget_usd===null;b.onclick=async()=>{const q=s=>"'"+String(s).replaceAll("'","''")+"'";const command='python scripts/cinema.py regenerate --out '+q(data.project_directory)+' --shot-id '+q(shot.id)+' --budget-usd '+data.cost.budget_usd+' --allow-paid --note '+q('人工复核后重做此镜头');try{await navigator.clipboard.writeText(command);message('命令已复制。运行前核对原预算和原因；工作台不会提交生成任务。')}catch{message(command)}};c.append(b);grid.append(c)}
if(page==='characters')for(const ch of data.plan.characters){const c=card(ch.name,ch.face+' · '+ch.hair);c.append(node('p','固定声线：'+ch.voice+' · '+ch.wardrobe));detail(c,'Character Bible v2',ch);grid.append(c)}
if(page==='scenes')for(const s of data.plan.scenes){const c=card(s.id+' · '+s.location,s.layout);c.append(node('p',s.time_of_day+' · '+s.lighting));detail(c,'场景与道具',s);grid.append(c)}
if(page==='tasks')for(const t of data.cost.tasks){const c=card(t.kind+' · '+t.provider,t.state);detail(c,'任务与错误',t);const rel=t.output.replace(data.project_directory,'').replace(/^[\\/]/,'');preview(c,rel);if(t.kind==='video'&&t.state==='complete'){const shot=data.plan.shots.find(s=>t.output.includes('shots\\'+s.id+'\\')||t.output.includes('shots/'+s.id+'/'));if(shot)reviewForm(c,shot.id,t.sha256,true)}grid.append(c)}
if(page==='review'){const c=card('分层验收');for(const [k,v] of Object.entries(data.review.acceptance))c.append(node('p',k+'：'+v,v==='Pending'?'warning':'ok'));detail(c,'完整质量评审',data.review);grid.append(c);if(data.manifest.output){const p=card('成片预览 · 待视听验收');preview(p,data.manifest.output.replace(data.project_directory,'').replace(/^[\\/]/,''));reviewForm(p,'episode',data.manifest.sha256);grid.append(p)}}
if(page==='budget'){const c=card('预算与任务预留','失败及结果未知的请求继续占用额度。实际账单须与服务商对账。');detail(c,'成本明细',data.cost);detail(c,'镜头修订',data.revisions);grid.append(c)}}
for(const [id,label]of [['shots','镜头'],['characters','角色'],['scenes','场景'],['tasks','任务 / 错误'],['budget','预算'],['review','质量与成片']]){const b=node('button',label);b.onclick=()=>{page=id;render()};$('nav').append(b)}async function load(){try{data=await api('/api/state');render()}catch(e){message(e.message)}}$('refresh').onclick=load;load();
</script></html>
